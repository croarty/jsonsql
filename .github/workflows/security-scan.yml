name: Dependency Security Scan

# Runs the OWASP Dependency-Check profile (mvn -Psecurity verify) against the
# full dependency tree and publishes findings to the Security > Code scanning
# tab. Runs weekly and on demand so newly disclosed CVEs are surfaced even
# when the code itself has not changed.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      # NVD_API_KEY is optional but strongly recommended: without it the NVD
      # feed download is heavily throttled. Add it under
      # Settings > Secrets and variables > Actions.
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp -Psecurity verify -DskipTests

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
