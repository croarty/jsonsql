name: CodeQL

# CodeQL performs static security analysis on the Java source and reports
# findings in the repository's Security > Code scanning tab.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly scan catches newly published rules against existing code.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-and-quality

      # Build without the test/verify phases so analysis is fast but still
      # sees all compiled classes.
      - name: Compile
        run: mvn -B -ntp clean compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
